<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cadastro - Ecostep</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<meta name="robots" content="noindex, nofollow">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<header class="reveal">
    <a href="index.html" class="logo-container">
        <img src="Logo.png" alt="Logo Ecostep" class="logo-ecostep">
    </a>
    <nav>
        <a href="index.html">Início</a>
        <a href="store.html">Loja</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html">Login</a>
        <button id="toggleTheme" aria-label="Ativar tema escuro">🌙</button>
    </nav>
</header>

<main class="card reveal">
    <h2>Cadastro</h2>
    <form id="formCadastro">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required minlength="6">

        <button type="submit">Cadastrar</button>
    </form>
    <div id="mensagem"></div>
</main>

<footer class="reveal">
    © Ecostep 2025 - v0.1
</footer>

<script src="script.js"></script>

<script type="module">
// Cadastro com Supabase
import { supabase } from "./supabase.js";

const formCadastro = document.getElementById('formCadastro');
const mensagem = document.getElementById('mensagem');

formCadastro.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value.trim();

    mensagem.innerText = "Processando cadastro...";

    const { data, error: signUpError } = await supabase.auth.signUp({
        email: email,
        password: senha
    });

    if (signUpError) {
        mensagem.innerText = `Erro ao cadastrar: ${signUpError.message}`;
        return;
    }

    // Se a confirmação de e-mail estiver ativa no Supabase, não há sessão ainda
    if (!data.session) {
        mensagem.innerText = "Cadastro realizado! Confirme seu e-mail para entrar.";
        return;
    }

    const { data: sessionData, error: sessionError } = await supabase.auth.getSession();

    if (sessionError || !sessionData.session) {
        mensagem.innerText = `Erro ao obter sessão: ${sessionError?.message || "Sessão não encontrada."}`;
        return;
    }

    const user_id = sessionData.session.user.id;

    const { error: insertError } = await supabase
        .from('usuarios')
        .insert([{ nome: nome, email: email, user_id: user_id }]);

    if (insertError) {
        mensagem.innerText = `Cadastro realizado, mas erro ao salvar no banco: ${insertError.message}`;
    } else {
        mensagem.innerText = "Cadastro realizado com sucesso! Redirecionando...";
        setTimeout(() => {
            window.location.href = "inicio.html";
        }, 1500);
    }
});

// Já está logado? Vai direto para a área logada
const { data: { session } } = await supabase.auth.getSession();
if (session) {
    window.location.replace("inicio.html");
}
</script>
</body>
</html>
