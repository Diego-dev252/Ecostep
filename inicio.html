<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Início - Ecostep</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<meta name="robots" content="noindex, nofollow">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<header class="reveal">
    <a href="index.html" class="logo-container">
        <img src="Logo.png" alt="Logo Ecostep" class="logo-ecostep">
    </a>
    <nav>
        <a href="index.html">Início</a>
        <a href="store.html">Loja</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html">Login</a>
        <button id="toggleTheme" aria-label="Ativar tema escuro">🌙</button>
    </nav>
</header>

<main class="card reveal">
    <h2>Bem-vindo!</h2>
    <p id="status">Verificando sessão...</p>
    <p>
        <button id="btnSair">Sair da conta</button>
    </p>
</main>

<footer class="reveal">
    © Ecostep 2025 - v0.1
</footer>

<script src="script.js"></script>
<script type="module">
    import { supabase } from "./supabase.js";

    const statusEl = document.getElementById('status');
    const btnSair = document.getElementById('btnSair');

    // Sessão protegida: sem login, volta para a página de login
    const { data: { user } } = await supabase.auth.getUser();

    if (!user) {
        window.location.replace('login.html');
    } else {
        statusEl.innerHTML = `Você está logado como <strong>${user.email}</strong>. Explore a loja e continue a ajudar o planeta!`;
    }

    btnSair.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.replace('index.html');
    });
</script>
</body>
</html>
