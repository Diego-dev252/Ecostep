<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Ecostep</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="robots" content="noindex, nofollow">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <header class="reveal">
    <a href="index.html" class="logo-container">
      <img src="Logo.png" alt="Logo Ecostep" class="logo-ecostep">
    </a>
    <nav>
      <a href="index.html">Início</a>
      <a href="store.html">Loja</a>
      <a href="cadastro.html">Cadastro</a>
      <a href="login.html">Login</a>
      <button id="toggleTheme" aria-label="Ativar tema escuro">🌙</button>
    </nav>
  </header>

  <main class="card reveal">
    <h2>Login</h2>
    <form id="formLogin">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required minlength="6">

      <button type="submit">Entrar</button>
    </form>
    <div id="mensagem"></div>
  </main>

  <footer class="reveal">
    © Ecostep 2025 - v0.1
  </footer>

  <script src="script.js"></script>

  <script type="module">
    // Login com Supabase
    import { supabase } from "./supabase.js";

    const formLogin = document.getElementById('formLogin');
    const mensagem = document.getElementById('mensagem');

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();

      mensagem.innerText = "Processando login...";

      const { error } = await supabase.auth.signInWithPassword({
        email: email,
        password: senha
      });

      if (error) {
        mensagem.innerText = `Erro ao logar: ${error.message}`;
        return;
      }

      mensagem.innerText = "Login realizado com sucesso! Redirecionando...";
      setTimeout(() => {
        window.location.href = "inicio.html";
      }, 1500);
    });

    // Já está logado? Vai direto para a área logada
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.replace("inicio.html");
    }
  </script>
</body>
</html>
